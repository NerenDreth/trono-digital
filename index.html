<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Trono Digital - Glassy Purple</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">TRONO DIGITAL</a>
    <div class="nav-auth-btns" id="authContainer"></div>
</nav>

<div class="main-content">
    <div class="stage">
        <!-- Barra de saldo integrada -->
        <div class="saldo-container">
            <span class="saldo-label">💰 Mi saldo:</span>
            <span class="saldo-valor" id="miSaldo">---</span>
            <button class="buy-button recarga-btn" onclick="recargarSaldo()">➕ Recargar $50</button>
        </div>

        <header>
            <h1 id="reyNombre">CARGANDO...</h1>
        </header>

       <div class="portrait-frame" onclick="cambiarFotoPerfil()">
    <img src="https://img.freepik.com/vector-premium/caricatura-rey-su-corona_167995-623.jpg" class="portrait-img" alt="King">
    <div class="foto-overlay">📷 Cambiar foto</div>
</div>

        <div class="price-label" id="reyPrecio">$0.00</div>
        
        <button class="buy-button" id="btnDerrocar">Derrocar Trono</button>

        <div class="footer-text" id="detallesPrecio">
            Precio para derrocar: --
        </div>

        <!-- Publicaciones dentro del stage -->
        <div class="publicaciones-section">
            <h3>📜 MENSAJES DEL TRONO</h3>
            
            <div id="listaPublicaciones">
                <div class="loading-pub">Cargando mensajes...</div>
            </div>
            
            <div id="formPublicar">
                <textarea id="contenidoPublicacion" placeholder="Escribe un mensaje para el reino..."></textarea>
                <div class="publicar-input-group">
                    <input type="text" id="enlacePublicacion" placeholder="Enlace (opcional - YouTube, etc.)">
                    <button onclick="publicarEnTrono()" class="buy-button">📢 Publicar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="close-modal" onclick="toggleModal()">×</button>
        <h2>ENTRAR AL TRONO</h2>
        <form id="loginForm">
            <input type="email" name="email" placeholder="TU EMAIL" class="input-jojo" required>
            <input type="password" name="password" placeholder="CONTRASEÑA" class="input-jojo" required>
            <button type="submit" class="buy-button" style="width: 100%; margin-top: 20px;">ACCEDER</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
